---
name: CI
'on':
  pull_request:
  push:
    branches:
      - main

jobs:

  test:
    name: Molecule
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          # amazonlinux2023 is the required check (Datavant's standard EL
          # target); debian13 exercises the role's actual Debian-only apt
          # cache branch in tasks/main.yml, which ubuntu wouldn't hit since
          # ansible_distribution there is "Ubuntu", not "Debian".
          - amazonlinux2023
          - debian13

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4

      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies.
        run: pip install --upgrade --upgrade-strategy eager -r requirements.txt

      # TEMPORARY: doesn't reproduce on my local (arm64) Mac at all - 3/3
      # local runs passed. Real CI is amd64, so this diagnoses whatever's
      # actually different about sudo/PAM on that architecture's image build
      # before landing a real fix. Remove once resolved.
      - name: Create instance and probe sudo/PAM directly.
        if: matrix.distro == 'amazonlinux2023'
        run: |
          molecule create
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}

      - name: Diagnose sudo/PAM in the running container.
        if: matrix.distro == 'amazonlinux2023'
        continue-on-error: true
        run: |
          set +e
          CID=$(docker ps -aq --filter name=instance)
          echo "container: $CID"
          docker exec "$CID" sh -c 'uname -m; cat /etc/os-release | head -3'
          echo "=== machine-id ==="
          docker exec "$CID" sh -c 'cat /etc/machine-id; echo "exit=$?"'
          echo "=== sudo -n whoami (as root) ==="
          docker exec "$CID" sh -c 'sudo -n whoami; echo "exit=$?"'
          echo "=== systemctl is-system-running ==="
          docker exec "$CID" sh -c 'systemctl is-system-running; echo "exit=$?"'
          echo "=== pam.d/sudo ==="
          docker exec "$CID" sh -c 'cat /etc/pam.d/sudo; echo "exit=$?"'
          echo "=== nsswitch.conf ==="
          docker exec "$CID" sh -c 'cat /etc/nsswitch.conf; echo "exit=$?"'
          echo "=== id root ==="
          docker exec "$CID" sh -c 'id root; getent passwd root; echo "exit=$?"'
          echo "=== journalctl (last 40 lines) ==="
          docker exec "$CID" sh -c 'journalctl --no-pager -n 40; echo "exit=$?"'
          echo "diagnostic step complete"

      - name: Destroy the diagnostic instance.
        if: matrix.distro == 'amazonlinux2023'
        run: molecule destroy
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}

      - name: Run Molecule tests.
        run: molecule test
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          MOLECULE_DISTRO: ${{ matrix.distro }}
