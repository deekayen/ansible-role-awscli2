---
# No play-level become: true - the docker connection already execs as root
# in these test images, and a no-op sudo call breaks amazonlinux2023's
# minimal PAM stack ("sudo: PAM account management error").
- name: Prepare
  hosts: all

  tasks:
    - name: Update yum cache.
      ansible.builtin.dnf:
        update_cache: true
      when: "ansible_os_family == 'RedHat' and ansible_distribution_major_version | int >= 8"

    - name: Update yum cache.
      ansible.builtin.dnf:
        update_cache: true
        use_backend: yum
      when: "ansible_os_family == 'RedHat' and ansible_distribution_major_version | int <= 7"

    - name: Update apt cache.
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 8640
      when: ansible_distribution == 'Debian'

    - name: Install unzip.
      ansible.builtin.package:
        name: unzip
      changed_when: false
