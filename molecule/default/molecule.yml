---
dependency:
  name: galaxy
driver:
  name: docker
lint: |
  set -e
  yamllint . &&
  ansible-lint &&
  flake8
platforms:
  - name: instance
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-amazonlinux2023}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    # GitHub Actions ubuntu-latest runners have AppArmor enforcing on the
    # host, which confines unix_chkpwd (PAM's account-check helper for
    # sudo) even inside a privileged container - denies dac_read_search/
    # dac_override, so sudo can't read /etc/shadow and fails with "PAM
    # account management error". Confirmed via kernel audit log on a live
    # CI run; doesn't reproduce on hosts without AppArmor (e.g. Docker
    # Desktop for Mac), which is why this only broke real CI.
    security_opts:
      - apparmor:unconfined
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  playbooks:
    converge: ${MOLECULE_PLAYBOOK:-converge.yml}
verifier:
  name: testinfra
